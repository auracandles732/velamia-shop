name: Instalar configurador de producto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-product-configurator.yml'
      - 'product-configurator.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar script en index.html
        shell: bash
        run: |
          if ! grep -q 'product-configurator.js' index.html; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="product-configurator.js?v=20260714"></script>\n'
          if '</body>' not in text:
              raise SystemExit('No se encontró </body> en index.html')
          path.write_text(text.replace('</body>', tag + '</body>', 1), encoding='utf-8')
          PY
          fi
      - name: Guardar cambio
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'El configurador ya estaba instalado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Activar configurador visual en páginas de producto'
          git push
